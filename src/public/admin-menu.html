<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Manager - Slurpin.pk Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🥟</span>
            <span class="font-extrabold text-lg text-amber-500">Slurpin.pk Admin</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-semibold">
            <a href="/" target="_blank" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg hover:bg-amber-500 hover:text-zinc-950 transition">🏠 View Website</a>
            <a href="/admin" class="text-zinc-300 hover:text-amber-400 transition">Live Orders</a>
            <a href="/admin/menu" class="text-amber-400 border-b-2 border-amber-500 pb-0.5">Menu Manager</a>
            <a href="/admin/queries" class="text-zinc-300 hover:text-amber-400 transition">Customer Queries</a>
            <a href="/admin/sales" class="text-zinc-300 hover:text-amber-400 transition">Sales Report</a>
            <button onclick="logout()" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 mt-6">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl mb-8">
            <h2 class="text-lg font-bold text-amber-500 mb-4">Add New Menu Item</h2>
            <form onsubmit="addMenuItem(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Item Name</label>
                    <input type="text" id="itemName" required placeholder="Spicy Chicken Dumplings" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Price (Rs.)</label>
                    <input type="number" id="itemPrice" required placeholder="500" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Image URL</label>
                    <input type="url" id="itemImage" required placeholder="https://..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Tag (e.g. POPULAR, NEW ARRIVAL)</label>
                    <input type="text" id="itemTag" placeholder="POPULAR" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Description</label>
                    <textarea id="itemDesc" required rows="2" placeholder="Delicious description..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div class="md:col-span-2">
                    <button type="submit" class="bg-amber-500 text-zinc-950 font-bold px-6 py-2.5 rounded-xl text-xs hover:bg-amber-400 transition shadow-md">Add Item to Menu</button>
                </div>
            </form>
        </div>

        <h2 class="text-lg font-bold text-amber-500 mb-4">Current Menu Items</h2>
        <div id="menuList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-zinc-500">Loading menu...</p>
        </div>
    </main>

    <!-- Edit Item Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeEditModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-100 text-xl font-bold">&times;</button>
            <h3 class="text-lg font-bold text-amber-500 mb-4">Edit Menu Item</h3>
            
            <form onsubmit="saveEditedItem(event)" class="space-y-4">
                <input type="hidden" id="editItemId">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Item Name</label>
                    <input type="text" id="editItemName" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Price (Rs.)</label>
                    <input type="number" id="editItemPrice" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Image URL</label>
                    <input type="url" id="editItemImage" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Tag (e.g. POPULAR, BESTSELLER)</label>
                    <input type="text" id="editItemTag" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Description</label>
                    <textarea id="editItemDesc" required rows="2" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-zinc-100 focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeEditModal()" class="bg-zinc-800 text-zinc-300 px-4 py-2 rounded-xl text-xs font-bold hover:bg-zinc-700 transition">Cancel</button>
                    <button type="submit" class="bg-amber-500 text-zinc-950 font-bold px-5 py-2 rounded-xl text-xs hover:bg-amber-400 transition">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('slurpin_admin_token');
        if (!token) window.location.href = '/admin/login';
        let currentMenu = [];

        async function fetchMenu() {
            try {
                const res = await fetch('/api/menu');
                const data = await res.json();
                currentMenu = data.menu || [];
                const container = document.getElementById('menuList');
                
                if (currentMenu.length === 0) {
                    container.innerHTML = '<p class="text-zinc-500">No items found.</p>';
                    return;
                }

                container.innerHTML = currentMenu.map(item => `
                    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl flex items-center justify-between gap-4">
                        <img src="${item.image}" class="w-16 h-16 rounded-xl object-cover bg-zinc-950" />
                        <div class="flex-1">
                            <h3 class="font-bold text-zinc-100 text-sm">${item.name}</h3>
                            <p class="text-amber-400 font-extrabold text-xs">Rs. ${item.price}</p>
                            <span class="text-[10px] text-zinc-400">${item.tag || ''}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openEditModal('${item.id}')" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-amber-500 hover:text-zinc-950 transition">✏️ Edit</button>
                            <button onclick="deleteItem('${item.id}')" class="bg-red-500/10 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-red-500 hover:text-white transition">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error loading menu');
            }
        }

        function openEditModal(id) {
            const item = currentMenu.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editItemId').value = item.id;
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editItemPrice').value = item.price;
            document.getElementById('editItemImage').value = item.image;
            document.getElementById('editItemTag').value = item.tag || '';
            document.getElementById('editItemDesc').value = item.description || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEditedItem(e) {
            e.preventDefault();
            const id = document.getElementById('editItemId').value;
            const updatedData = {
                name: document.getElementById('editItemName').value,
                price: document.getElementById('editItemPrice').value,
                image: document.getElementById('editItemImage').value,
                tag: document.getElementById('editItemTag').value,
                description: document.getElementById('editItemDesc').value
            };

            const res = await fetch(`/api/admin/menu/${id}`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-token': token 
                },
                body: JSON.stringify(updatedData)
            });

            if (res.ok) {
                alert('✅ Menu item updated successfully!');
                closeEditModal();
                fetchMenu();
            } else {
                alert('Failed to update menu item.');
            }
        }

        async function addMenuItem(e) {
            e.preventDefault();
            const newItem = {
                name: document.getElementById('itemName').value,
                price: document.getElementById('itemPrice').value,
                image: document.getElementById('itemImage').value,
                tag: document.getElementById('itemTag').value,
                description: document.getElementById('itemDesc').value
            };

            const res = await fetch('/api/admin/menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
                body: JSON.stringify(newItem)
            });
            if (res.ok) {
                alert('✅ Menu item added successfully!');
                e.target.reset();
                fetchMenu();
            }
        }

        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            const res = await fetch(`/api/admin/menu/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-token': token }
            });
            if (res.ok) {
                alert('🗑️ Item deleted!');
                fetchMenu();
            }
        }

        function logout() {
            localStorage.removeItem('slurpin_admin_token');
            window.location.href = '/admin/login';
        }

        window.addEventListener('load', fetchMenu);
    </script>
</body>
</html>
