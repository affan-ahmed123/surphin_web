<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Slurpin.pk</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-amber-500 to-amber-300"></div>

        <div class="text-center mb-8">
            <span class="text-4xl">🥟</span>
            <h1 class="text-2xl font-black text-amber-500 mt-2">Slurpin.pk Admin</h1>
            <p class="text-xs text-zinc-400 mt-1">Enter your credentials to manage live orders & menu.</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Admin Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-xs text-zinc-100 focus:outline-none focus:border-amber-500 transition">
            </div>
            <button type="submit" class="w-full bg-amber-500 text-zinc-950 font-extrabold py-3 rounded-xl text-xs hover:bg-amber-400 transition shadow-lg shadow-amber-500/10">Login to Dashboard</button>
        </form>

        <div class="mt-6 text-center">
            <button onclick="openRecoveryModal()" class="text-xs text-amber-400 hover:underline font-semibold">Forgot Password?</button>
        </div>
    </div>

    <!-- Password Recovery Modal -->
    <div id="recoveryModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeRecoveryModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-zinc-100 text-xl font-bold">&times;</button>
            <h3 class="text-lg font-bold text-amber-500 mb-1">Password Recovery</h3>
            <p class="text-xs text-zinc-400 mb-4">Click below to generate recovery OTP. You can also view the OTP instantly in your server console terminal.</p>

            <div id="step1Form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Authorized Number</label>
                    <input type="text" id="recoveryPhone" value="03032781433" readonly class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-400 cursor-not-allowed">
                </div>
                <button onclick="requestOtp()" class="w-full bg-amber-500 text-zinc-950 font-extrabold py-2.5 rounded-xl text-xs hover:bg-amber-400 transition">Send WhatsApp OTP</button>
            </div>

            <div id="whatsappLinkContainer" class="hidden my-4 p-4 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl text-center">
                <p class="text-xs text-emerald-300 mb-2 font-semibold">✅ OTP generated successfully!</p>
                <a id="waDirectLink" href="#" target="_blank" class="inline-block bg-emerald-500 text-zinc-950 font-bold px-4 py-2 rounded-xl text-xs hover:bg-emerald-400 transition shadow-md">💬 Open WhatsApp to View OTP</a>
            </div>

            <div id="step2Form" class="space-y-4 hidden mt-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Enter 6-Digit OTP</label>
                    <input type="text" id="otpCode" placeholder="123456" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">New Password</label>
                    <input type="password" id="newPassword" placeholder="••••••••" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <button onclick="resetPassword()" class="w-full bg-amber-500 text-zinc-950 font-extrabold py-2.5 rounded-xl text-xs hover:bg-amber-400 transition">Update Password</button>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('slurpin_admin_token', data.token);
                window.location.href = '/admin';
            } else {
                alert(data.message || 'Invalid password');
            }
        }

        function openRecoveryModal() {
            document.getElementById('recoveryModal').classList.remove('hidden');
        }

        function closeRecoveryModal() {
            document.getElementById('recoveryModal').classList.add('hidden');
            document.getElementById('whatsappLinkContainer').classList.add('hidden');
            document.getElementById('step2Form').classList.add('hidden');
        }

        async function requestOtp() {
            const phone = document.getElementById('recoveryPhone').value;
            const res = await fetch('/api/admin/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('waDirectLink').href = data.whatsappUrl;
                document.getElementById('whatsappLinkContainer').classList.remove('hidden');
                document.getElementById('step2Form').classList.remove('hidden');
            } else {
                alert(data.message);
            }
        }

        async function resetPassword() {
            const phone = document.getElementById('recoveryPhone').value;
            const otp = document.getElementById('otpCode').value;
            const newPassword = document.getElementById('newPassword').value;

            const res = await fetch('/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, otp, newPassword })
            });
            const data = await res.json();
            if (data.success) {
                alert('✅ Password successfully updated! Please login with your new password.');
                closeRecoveryModal();
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
