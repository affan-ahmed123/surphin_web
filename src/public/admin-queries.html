<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Queries - Slurpin.pk Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🥟</span>
            <span class="font-extrabold text-lg text-amber-500">Slurpin.pk Admin</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-semibold">
            <a href="/" target="_blank" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg hover:bg-amber-500 hover:text-zinc-950 transition">🏠 View Website</a>
            <a href="/admin" class="text-zinc-300 hover:text-amber-400 transition">Live Orders</a>
            <a href="/admin/menu" class="text-zinc-300 hover:text-amber-400 transition">Menu Manager</a>
            <a href="/admin/queries" class="text-amber-400 border-b-2 border-amber-500 pb-0.5">Customer Queries</a>
            <a href="/admin/sales" class="text-zinc-300 hover:text-amber-400 transition">Sales Report</a>
            <button onclick="logout()" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 mt-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-amber-500">Customer Inquiries</h1>
                <p class="text-xs text-zinc-400 mt-1">Review custom questions and catering requests submitted by customers.</p>
            </div>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-zinc-950 border-b border-zinc-800 text-zinc-400 uppercase tracking-wider">
                            <th class="p-4">Time</th>
                            <th class="p-4">Customer Name</th>
                            <th class="p-4">Phone / WhatsApp</th>
                            <th class="p-4">Message / Query</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="queriesTableBody" class="divide-y divide-zinc-800/80">
                        <tr>
                            <td colspan="5" class="p-6 text-center text-zinc-500">Loading queries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('slurpin_admin_token');
        if (!token) window.location.href = '/admin/login';

        async function fetchQueries() {
            try {
                const res = await fetch('/api/admin/queries', {
                    headers: { 'x-admin-token': token }
                });
                if (res.status === 401) { logout(); return; }
                const data = await res.json();
                
                const tbody = document.getElementById('queriesTableBody');
                if (!data.queries || data.queries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-zinc-500">No customer inquiries found yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.queries.map(q => {
                    const cleanPhone = q.phone.replace(/[^0-9]/g, '');
                    const formattedPhone = cleanPhone.startsWith('03') ? '92' + cleanPhone.slice(1) : cleanPhone;
                    const replyMsg = `Hi ${q.name}, regarding your query on Slurpin.pk: "${q.message}" - `;
                    const whatsappUrl = `https://wa.me/${formattedPhone}?text=${encodeURIComponent(replyMsg)}`;

                    return `
                        <tr class="hover:bg-zinc-800/40 transition">
                            <td class="p-4 text-zinc-400 whitespace-nowrap">${new Date(q.createdAt).toLocaleString()}</td>
                            <td class="p-4 font-bold text-zinc-100">${q.name}</td>
                            <td class="p-4 text-amber-400 font-semibold">${q.phone}</td>
                            <td class="p-4 text-zinc-300 max-w-xs leading-relaxed">${q.message}</td>
                            <td class="p-4 text-right whitespace-nowrap">
                                <a href="${whatsappUrl}" target="_blank" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-500 hover:text-zinc-950 transition">Reply on WhatsApp</a>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Failed to load queries:', err);
            }
        }

        function logout() {
            localStorage.removeItem('slurpin_admin_token');
            window.location.href = '/admin/login';
        }

        window.addEventListener('load', fetchQueries);
    </script>
</body>
</html>
