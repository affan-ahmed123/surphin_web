<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Orders - Slurpin Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <nav class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🥟</span>
            <span class="font-extrabold text-lg text-amber-500">Slurpin Admin</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-semibold">
            <a href="/" target="_blank" class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-3 py-1.5 rounded-lg hover:bg-amber-500 hover:text-zinc-950 transition">🏠 View Website</a>
            <a href="/admin" class="text-amber-400 border-b-2 border-amber-500 pb-0.5">Live Orders</a>
            <a href="/admin/menu" class="text-zinc-300 hover:text-amber-400 transition">Menu Manager</a>
            <a href="/admin/queries" class="text-zinc-300 hover:text-amber-400 transition">Customer Queries</a>
            <a href="/admin/sales" class="text-zinc-300 hover:text-amber-400 transition">Sales Report</a>
            <a href="/admin/settings" class="text-zinc-300 hover:text-amber-400 transition">Payment Settings</a>
            <button onclick="logout()" class="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg hover:bg-red-500 hover:text-white transition">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-amber-500">Live Order Tracking</h1>
            <p class="text-xs text-zinc-400 mt-1">Manage incoming orders, view exact time stamps, and dispatch WhatsApp confirmations.</p>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-xl">
            <table class="w-full text-left text-xs">
                <thead class="bg-zinc-950 text-zinc-400 uppercase border-b border-zinc-800">
                    <tr>
                        <th class="p-4">Order ID & Time</th>
                        <th class="p-4">Customer</th>
                        <th class="p-4">Phone</th>
                        <th class="p-4">Address</th>
                        <th class="p-4">Items & Total</th>
                        <th class="p-4">Status</th>
                        <th class="p-4 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="ordersTable" class="divide-y divide-zinc-800 text-zinc-300">
                    <tr><td colspan="7" class="p-6 text-center text-zinc-500">Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('slurpin_admin_token');
        if (!token) window.location.href = '/admin/login';

        async function fetchOrders() {
            try {
                const res = await fetch('/api/admin/orders', {
                    headers: { 'x-admin-token': token }
                });
                const data = await res.json();
                renderOrders(data.orders || []);
            } catch (err) {
                console.error('Failed to load orders');
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersTable');
            if (orders.length === 0) {
                container.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-zinc-500">No orders placed yet.</td></tr>';
                return;
            }

            container.innerHTML = orders.map(o => `
                <tr class="hover:bg-zinc-950/50 transition">
                    <td class="p-4">
                        <span class="font-extrabold text-amber-400 text-sm block">#${o.id}</span>
                        <span class="text-[10px] text-zinc-400">${o.createdAt || 'Just now'}</span>
                    </td>
                    <td class="p-4 font-semibold text-zinc-200">${o.customerName}</td>
                    <td class="p-4 text-zinc-400">${o.phone}</td>
                    <td class="p-4 text-zinc-400 max-w-[180px] truncate">${o.address}</td>
                    <td class="p-4">
                        <div class="space-y-0.5 text-zinc-300">
                            ${o.items.map(i => `<div>${i.name} (x${i.quantity})</div>`).join('')}
                        </div>
                        <div class="text-amber-400 font-extrabold mt-1">Rs. ${o.totalAmount.toLocaleString()}</div>
                    </td>
                    <td class="p-4">
                        ${o.status === 'Delivered' 
                            ? '<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full text-[10px] font-extrabold">DELIVERED</span>' 
                            : '<span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-full text-[10px] font-extrabold">PENDING</span>'}
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex items-center justify-center gap-2">
                            ${o.status !== 'Delivered' 
                                ? `<button onclick="markDelivered('${o.id}')" class="bg-emerald-500 text-zinc-950 px-3 py-1.5 rounded-xl font-bold text-[11px] hover:bg-emerald-400 transition shadow">Mark Delivered</button>`
                                : `<span class="text-zinc-500 text-[11px] font-semibold">Completed</span>`}
                            <button onclick="deleteOrder('${o.id}')" class="bg-red-500/10 text-red-400 border border-red-500/30 p-1.5 rounded-xl hover:bg-red-500 hover:text-white transition" title="Delete Order">🗑️</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        async function markDelivered(id) {
            try {
                const res = await fetch(`/api/admin/orders/${id}/deliver`, {
                    method: 'PATCH',
                    headers: { 'x-admin-token': token }
                });
                const data = await res.json();
                if (data.success) {
                    if (data.whatsappUrl) {
                        window.open(data.whatsappUrl, '_blank');
                    }
                    fetchOrders();
                } else {
                    alert('Failed to update order status.');
                }
            } catch (err) {
                alert('Error connecting to server.');
            }
        }

        async function deleteOrder(id) {
            if (!confirm(`Are you sure you want to delete order #${id}?`)) return;

            try {
                const res = await fetch(`/api/admin/orders/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-token': token }
                });
                const data = await res.json();
                if (data.success) {
                    fetchOrders();
                } else {
                    alert('Failed to delete order.');
                }
            } catch (err) {
                alert('Error deleting order.');
            }
        }

        function logout() {
            localStorage.removeItem('slurpin_admin_token');
            window.location.href = '/admin/login';
        }

        window.addEventListener('load', fetchOrders);
    </script>
</body>
</html>
