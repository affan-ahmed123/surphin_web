<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slurpin.pk - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans p-6">
    <div class="max-w-6xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-amber-500">Slurpin.pk Admin Panel</h1>
                <p class="text-zinc-400 text-xs mt-1">Manage Orders, WhatsApp Delivery Confirmations & Launch New Items</p>
            </div>
            <a href="/" class="bg-zinc-800 text-zinc-200 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-zinc-700 transition">View Website</a>
        </div>

        <!-- Add New Menu Item Form Section -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-amber-400 mb-4 flex items-center gap-2">
                <span>✨</span> Launch New Menu Item / Variety
            </h2>
            <form onsubmit="addNewMenuItem(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Item Title</label>
                    <input type="text" id="itemName" required placeholder="e.g. Crispy Fried Momos" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Price (Rs.)</label>
                    <input type="number" id="itemPrice" required placeholder="650" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Badge Tag</label>
                    <select id="itemTag" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500">
                        <option value="NEW ARRIVAL">NEW ARRIVAL</option>
                        <option value="NEW VARIETY">NEW VARIETY</option>
                        <option value="SPECIAL">SPECIAL</option>
                        <option value="POPULAR">POPULAR</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Image URL</label>
                    <input type="url" id="itemImage" required placeholder="https://images.unsplash.com/..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Description</label>
                    <textarea id="itemDesc" required rows="2" placeholder="Item description & ingredients..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-zinc-100 focus:outline-none focus:border-amber-500"></textarea>
                </div>
                <button type="submit" class="md:col-span-2 bg-amber-500 text-zinc-950 font-bold py-2.5 rounded-xl hover:bg-amber-400 transition text-sm">Add Item to Website Menu</button>
            </form>
        </div>

        <!-- Incoming Customer Orders Section -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-4 text-zinc-100">Customer Orders</h2>
            <div id="orders-container" class="space-y-4">
                <p class="text-zinc-500 text-sm">Loading active orders...</p>
            </div>
        </div>

    </div>

    <script>
        async function fetchOrders() {
            try {
                const res = await fetch('/api/admin/orders');
                const data = await res.json();
                const container = document.getElementById('orders-container');
                
                if(!data.orders || data.orders.length === 0) {
                    container.innerHTML = '<p class="text-zinc-500 text-sm">No orders received yet.</p>';
                    return;
                }

                container.innerHTML = data.orders.map(order => `
                    <div class="border border-zinc-800 bg-zinc-950 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-md">
                        <div>
                            <span class="text-xs font-bold px-2.5 py-1 rounded-full ${order.status === 'Delivered' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'}">${order.status}</span>
                            <h3 class="font-bold text-zinc-100 mt-2">${order.customerName} (${order.phone})</h3>
                            <p class="text-zinc-400 text-xs">${order.address}</p>
                            <p class="text-amber-400 text-xs font-semibold mt-1">Items: ${order.items.map(i => `${i.name} x${i.quantity}`).join(', ')} — Total: Rs. ${order.totalAmount}</p>
                        </div>
                        <div>
                            ${order.status !== 'Delivered' ? `
                                <button onclick="markDelivered('${order.id}')" class="bg-amber-500 text-zinc-950 px-4 py-2 rounded-xl font-bold text-xs hover:bg-amber-400 transition shadow-md">
                                    Mark Delivered & Send WhatsApp Msg 🚀
                                </button>
                            ` : `<span class="text-emerald-400 text-xs font-bold flex items-center gap-1">✓ Delivered & Notification Triggered</span>`}
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Error fetching orders:', err);
            }
        }

        async function markDelivered(id) {
            const res = await fetch(`/api/admin/orders/${id}/deliver`, { method: 'PATCH' });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                if (data.whatsappUrl) {
                    window.open(data.whatsappUrl, '_blank');
                }
                fetchOrders();
            }
        }

        async function addNewMenuItem(e) {
            e.preventDefault();
            const itemData = {
                name: document.getElementById('itemName').value,
                price: document.getElementById('itemPrice').value,
                tag: document.getElementById('itemTag').value,
                image: document.getElementById('itemImage').value,
                description: document.getElementById('itemDesc').value
            };

            const res = await fetch('/api/admin/menu', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            });
            const data = await res.json();
            if (data.success) {
                alert('🎉 ' + data.message);
                e.target.reset();
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>
</body>
</html>
